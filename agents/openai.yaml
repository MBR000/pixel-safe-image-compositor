# Codex agent metadata for the pixel-safe-image-compositor skill.
interface:
  display_name: Pixel-Safe Image Compositor
  short_description: >-
    AI-designed image compositing with programmatic mask restoration and
    SHA-256 pixel verification of the protected source region.
  default_prompt: >-
    Composite this image following the pixel-safe workflow: write
    composition-plan.json, validate it with scripts/preflight_composition.py,
    generate the background with the visual AI, then restore and verify the
    protected pixels with scripts/restore_and_verify.py.
